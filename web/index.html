<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>barcode-id</title>
<style>
  :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --line: #ddddd6; --accent: #1f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #33332f; --accent: #58a6ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  #camera { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; overflow: hidden; }
  #camera video, #camera canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #camera canvas.drawingBuffer { display: none; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--accent); color: #fff; }
  .row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  input { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; flex: 1; min-width: 0; }
  #code { font: 600 22px/1.3 ui-monospace, monospace; margin-top: 12px; }
  #info { margin-top: 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  details { margin-top: 16px; }
</style>
</head>
<body>
<h1>barcode-id</h1>
<div id="camera"></div>
<div class="row">
  <button id="toggle">카메라 시작</button>
  <input id="manual" inputmode="numeric" placeholder="또는 바코드 번호 입력">
</div>
<div id="code" class="muted">—</div>
<div id="engine" class="muted"></div>
<div id="info"></div>
<details>
  <summary class="muted">조회 서버</summary>
  <div class="row"><input id="url" placeholder="http://localhost:8010"><input id="token" placeholder="토큰 (BARCODE_ID_TOKEN)" type="password"></div>
  <p class="muted">서버가 없으면 번호만 읽습니다. 서버 실행: <code>cd server && uv run barcode-id</code></p>
  <p class="muted">읽는 것: EAN-13/JAN, EAN-8, UPC-A/E, QR (GS1 QR·Digital Link면 유효기한·로트, 일본어 Shift-JIS·한자 모드 포함). 브라우저에 내장 인식기가 있으면 DataMatrix도.</p>
</details>

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.13.0/dist/quagga.min.js"></script>
<script type="module">
import decodeQR from "./vendor/qr/decode.js";
import { startScanner, identify, isValidGtin } from "./barcode-id.js";

const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k) ?? ""; } catch { return ""; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
for (const k of ["url", "token"]) { $(k).value = store.get("barcode-id." + k); $(k).onchange = () => store.set("barcode-id." + k, $(k).value); }

function showText(text, info) {
  $("code").textContent = "QR"; $("code").classList.remove("muted");
  $("info").textContent = "";
  const a = document.createElement(info.kind === "url" ? "a" : "span");
  a.textContent = text;
  if (info.kind === "url") { a.href = text; a.target = "_blank"; a.rel = "noopener"; }
  $("info").append(a);
}

async function show(code, info = {}) {
  const extra = [info.expiry && `유효기한 ${info.expiry}`, info.bestBefore && `품질유지기한 ${info.bestBefore}`, info.lot && `로트 ${info.lot}`]
    .filter(Boolean).join(" · ");
  $("code").textContent = code + (extra ? `  (${extra})` : ""); $("code").classList.remove("muted");
  $("info").textContent = "";
  if (!$("url").value) { $("info").innerHTML = '<span class="muted">조회 서버가 설정되지 않았습니다.</span>'; return; }
  $("info").textContent = "조회 중…";
  try {
    const r = await identify(code, { url: $("url").value, token: $("token").value });
    const name = r.spoken_name ?? r.identity?.name;
    const price = r.cheapest ? ` · 최저 ${r.cheapest.price.toLocaleString()} ${r.cheapest.currency === "KRW" ? "원" : "엔"}` : "";
    const maker = r.identity?.brand ? ` · ${r.identity.brand}` : "";
    $("info").textContent = name ? `${name}${maker}${price}` : "등록된 상품을 찾지 못했습니다.";
  } catch (e) {
    $("info").textContent = `조회 실패: ${e.message}`;
  }
}

let scanner = null;
$("toggle").onclick = async () => {
  if (scanner) { scanner.stop(); scanner = null; $("toggle").textContent = "카메라 시작"; return; }
  try {
    scanner = await startScanner($("camera"), {
      decodeQR,
      onCode: (code, info) => { navigator.vibrate?.(60); show(code, info); },
      onText: (text, info) => { navigator.vibrate?.(60); showText(text, info); },
    });
    $("toggle").textContent = "카메라 정지";
    $("engine").textContent = scanner.engine === "native" ? "브라우저 내장 인식기" : "Quagga2 + paulmillr/qr";
  } catch (e) {
    $("info").textContent = `카메라를 열 수 없습니다: ${e.message ?? e}`;
  }
};
$("manual").onkeydown = (e) => {
  if (e.key !== "Enter") return;
  const code = $("manual").value.trim();
  if (isValidGtin(code)) show(code.length === 12 ? "0" + code : code);
  else $("info").textContent = "체크 숫자가 맞지 않는 번호입니다.";
};
</script>
</body>
</html>
